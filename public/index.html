    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // GitHub Pages can't route /blog/... itself: 404.html sends it here as /?/blog/..., and this puts the path back
      (function (l) {
        if (l.search[1] === '/') {
          var path = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + path + l.hash);
        }
      }(window.location));
    </script>
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
